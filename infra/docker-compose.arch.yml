services:

  # Batch CLI: use via `docker compose run --rm likec4 <command>`
  likec4:
    build:
      context: ./likec4
    image: otus-aia/likec4:local
    working_dir: /data
    init: true
    ipc: host
    entrypoint: ["likec4"]

  # Interactive dev: PoC model on http://localhost:5173
  likec4-dev-poc:
    image: otus-aia/likec4:local
    working_dir: /data
    init: true
    ipc: host
    ports:
      - "5173:5173"
      - "24678:24678"
    environment:
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "200"
    volumes:
      - ../architecture/poc:/data
    command: ["start", "--host", "0.0.0.0"]
    profiles: [arch-dev]

  # Interactive dev: MVP model on http://localhost:5174
  likec4-dev-mvp:
    image: otus-aia/likec4:local
    working_dir: /data
    init: true
    ipc: host
    ports:
      - "5174:5173"
      - "24679:24678"
    environment:
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "200"
    volumes:
      - ../architecture/mvp:/data
    command: ["start", "--host", "0.0.0.0"]
    profiles: [arch-dev]
