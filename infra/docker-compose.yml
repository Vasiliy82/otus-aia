services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: otus-aia-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-otus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otus}
      POSTGRES_DB: ${POSTGRES_DB:-graphrag_poc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-otus} -d ${POSTGRES_DB:-graphrag_poc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.64
    container_name: otus-aia-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14268:14268"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: otus-aia-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

volumes:
  postgres_data:
