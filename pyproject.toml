[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otus-aia"
version = "0.1.0"
description = "Secure GraphRAG PoC — курсовая OTUS AI-Архитектор"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "datasets>=2.14",
    "huggingface_hub>=0.20",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
